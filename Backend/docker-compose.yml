services:
  postgres:
    image: postgres:18-alpine

    container_name: register-login
    ports:
    - "${DB_PORT}:5432"

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRESS_DB: ${DB_NAME}
    
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: